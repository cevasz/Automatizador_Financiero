name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x kivo-android/gradlew

      - name: Run unit tests
        working-directory: kivo-android
        run: ./gradlew test --no-daemon

      - name: Build Debug APK
        working-directory: kivo-android
        run: ./gradlew assembleDebug --no-daemon

      # La variante release aplica R8 (ofuscacion + eliminacion de codigo no
      # usado), que puede romper cosas que la debug nunca toca: Room resuelve sus
      # implementaciones por nombre, y los servicios del manifiesto tambien. Sin
      # este paso, esos fallos solo aparecerian al publicar. Sale sin firmar
      # porque el keystore no vive en el repositorio.
      - name: Build Release APK (sin firmar, valida R8)
        working-directory: kivo-android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: kivo-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Show APK info
        run: |
          ls -la kivo-android/app/build/outputs/apk/debug/
          echo "APK size: $(du -h kivo-android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
